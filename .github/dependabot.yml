version: 2
updates:
  # Python dependencies, resolved through uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      # The orchestration and model-client packages release together and are tested together.
      langchain:
        patterns: ["langchain*", "langgraph*"]
      dev-tools:
        patterns: ["pytest*", "ruff"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
