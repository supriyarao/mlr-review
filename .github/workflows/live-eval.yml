name: Live eval

# Runs the golden set against real models. It costs money and needs a secret, so it is started by
# hand only. There is deliberately no pull_request trigger: a workflow that hands a secret to code
# from a fork is how API keys leak, and workflow_dispatch can only be used by people with write
# access to this repository.

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: Times to run each case (the worst outcome per case is kept)
        required: true
        default: "1"
        type: choice
        options: ["1", "3", "5"]
      model_strong:
        description: Model for the strong tier
        required: true
        default: claude-sonnet-5
      model_fast:
        description: Model for the fast tier
        required: true
        default: claude-haiku-4-5

permissions:
  contents: read

concurrency:
  group: live-eval
  cancel-in-progress: false

jobs:
  live-eval:
    name: Golden set against live models
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Belt and braces: never run from a fork, whatever triggers are added later.
    if: github.event.repository.fork == false
    env:
      MLR_LLM_BACKEND: anthropic
      MLR_MODEL_STRONG: ${{ inputs.model_strong }}
      MLR_MODEL_FAST: ${{ inputs.model_fast }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      REPEATS: ${{ inputs.repeats }}
    steps:
      - uses: actions/checkout@v7

      - name: Fail early if the secret is not configured
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Set the ANTHROPIC_API_KEY repository secret to run a live eval."
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: chroma-onnx-${{ runner.os }}

      - name: Seed the synthetic corpus
        run: make seed

      # Reported against the baseline but not gated on it: a live run varies from one execution to
      # the next, so the hard gate lives in CI's deterministic offline replay.
      - name: Run the golden set
        run: uv run python -m scripts.run_evals --mode live --repeats "$REPEATS"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-eval-${{ github.run_id }}
          path: evals/results/
          if-no-files-found: warn
          retention-days: 30
