id: ACME-TM-001
tenant_id: acme_pharma
title: Trademark symbol on first mention
description: >-
  The product name must carry the registered trademark symbol on its first mention in every
  promotional piece.
kind: deterministic
severity: advisory
check_type: business_rule
scope:
  audience: any
  product_ids:
    - zelvoran
params:
  type: trademark_first_mention
  brand: Zelvoran
  window: 3
  suggested_fix: >-
    Add the registered trademark symbol to the first mention of the brand name: Zelvoran®.
examples:
  - text: Zelvoran is indicated for moderate-to-severe plaque psoriasis in adults.
    expected: fail
    note: First mention carries no symbol.
  - text: "Zelvoran® is indicated for moderate-to-severe plaque psoriasis in adults."
    expected: pass
    note: First mention carries the registered symbol.
  - text: "Zelvoran® is dosed every 4 weeks. Zelvoran is well tolerated in adults."
    expected: pass
    note: House style marks the first mention only; later mentions need no symbol.
owner: Brand Marketing
effective_from: "2026-01-01"
status: active
source_ref: Acme Brand and Promotional Code, clause 7
