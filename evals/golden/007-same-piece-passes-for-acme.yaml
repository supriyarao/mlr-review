id: 007-same-piece-passes-for-acme
title: Safety information at the back - acceptable to Acme
why_hard: >-
  Paired with case 008, which submits this exact file under the other tenant. The piece is competent:
  correctly referenced, trademark marked, Prescribing Information signposted, and its safety
  information complete. The only question is placement - six sections and 1,700 characters separate it
  from the first efficacy claim. Acme requires safety information to be present and treats prominence
  as a correctable editorial matter, so this passes to a standard reviewer. The case exists to prove
  the system does not simply escalate anything with an unusual layout.
tenant_id: acme_pharma
