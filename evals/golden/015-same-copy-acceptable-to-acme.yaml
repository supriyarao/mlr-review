id: 015-same-copy-acceptable-to-acme
title: The same copy under Acme, which has no disclaimer rule
why_hard: >-
  The counterpart to case 014, and the reason that case means anything. If this piece also escalated,
  the disclaimer finding in 014 would not be evidence of per-tenant policy - it could just be a system
  that flags patient material generally. Acme has no patient-disclaimer rule, so the same text with the
  same absence must reach a standard reviewer. Note the product differs by necessity: Nexapril is
  Borealis-only, so this submits the equivalent Zelvoran copy. The point under test is the rule's
  audience scope, not the molecule.
tenant_id: acme_pharma
product_id: zelvoran
label_version: "1.0"
audience: patient
channel: patient_leaflet
market: us
promo: |
  # Understanding Zelvoran

  ## What Zelvoran is for

  Zelvoran® (zelvoran) is for adults with moderate-to-severe plaque psoriasis who are candidates for
  systemic therapy or phototherapy.

  In a 16-week study of 812 adults, 68.4% of those treated with Zelvoran saw at least a 75% improvement
  in their psoriasis score, compared with 9.2% who received placebo [1].

  ## Important Safety Information

  Zelvoran can lower your ability to fight infections. Tell your doctor if you have an infection. Your
  doctor will test you for tuberculosis before you start treatment. Some people have had changes in
  liver blood tests. Serious allergic reactions, including swelling of the face or throat, can happen.
  The most common side effects were cold symptoms, reactions where the injection was given, and
  headache.

  ## References

  1. ZEL-301. Randomised, double-blind, placebo-controlled, 16 weeks, 812 adults.

  Please see full Prescribing Information.
