id: 010-clean-piece
title: A compliant piece that must produce no blockers
why_hard: >-
  Hard in the opposite direction from the rest of the set. Every claim is a labelled result stated with
  its comparator and timepoint, every claim carries a reference, the trademark is marked on first
  mention, safety information sits immediately after the efficacy section and is proportionate, and the
  Prescribing Information is signposted. The difficulty is that a system tuned to find problems will
  find one here - and a false blocker on correct material costs a reviewer's trust in every other
  finding the system produces. This case is why false escalation rate is reported next to blocker
  recall rather than beneath it.
