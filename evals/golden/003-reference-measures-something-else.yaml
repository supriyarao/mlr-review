id: 003-reference-measures-something-else
title: Cited reference reports a different endpoint at a different timepoint
why_hard: >-
  The citation looks correct and the study is real, relevant and about the right product. The claim
  states PASI-90 at 12 weeks and cites Reference 3; ZEL-303 reports PASI-75 at Week 16 and Week 52,
  did not assess PASI-90, and made no Week 12 assessment. So the reference is wrong on both the
  endpoint and the timepoint, and the only way to see it is to read what the cited study actually
  measured rather than whether it exists. A retrieval system that scores relevance will rank ZEL-303
  highly for this claim, which is exactly the trap.
tenant_id: acme_pharma
product_id: zelvoran
label_version: "1.0"
audience: hcp
channel: sales_aid
market: us
promo: |
  # Durable PASI-90 response

  ## Efficacy

  Zelvoran® (zelvoran) is indicated for the treatment of moderate-to-severe plaque psoriasis in adults
  who are candidates for systemic therapy or phototherapy.

  PASI-90 was achieved and maintained at 12 weeks in the extension study [3].

  ## Important Safety Information

  Zelvoran is contraindicated in active, serious infection, including active tuberculosis. Serious
  infections, hepatic enzyme elevations and serious hypersensitivity reactions have been reported. The
  most common adverse reactions were nasopharyngitis (14.1%), injection-site reaction (9.4%) and
  headache (7.2%).

  ## References

  3. ZEL-303. Open-label extension, 52 weeks, 610 adults.

  Please see full Prescribing Information.
expected_findings:
  - check_type: reference_support
    claim_contains: maintained at 12 weeks
    severity: blocker
    note: ZEL-303 reports PASI-75 at Week 16 and Week 52; it assessed neither PASI-90 nor Week 12.
expected_route: senior_regulatory
must_not_flag:
  - Zelvoran is indicated for the treatment of moderate-to-severe plaque psoriasis in adults
  - Please see full Prescribing Information
tags: [reference_support, endpoint_mismatch, timepoint_mismatch]
